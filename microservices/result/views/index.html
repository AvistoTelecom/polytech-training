<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{{.OptionA}} vs {{.OptionB}} -- Result</title>
    <base href="/index.html">
    <meta name = "viewport" content = "width=device-width, initial-scale = 1.0">
    <meta name="keywords" content="docker-compose, docker, stack">
    <meta name="author" content="Docker">
    <link rel='stylesheet' href='/stylesheets/style.css' />
  </head>
  <body>
     <div id="background-stats">
       <div id="background-stats-1">
       </div><!--
      --><div id="background-stats-2">
      </div>
    </div>
    <div id="content-container">
      <div id="content-container-center">
        <div id="choice">
          <div class="choice a">
            <div class="label">{{.OptionA}}</div>
            <div class="stat"><span id="a-percent">50</span>%</div>
          </div>
          <div class="divider"></div>
          <div class="choice b">
            <div class="label">{{.OptionB}}</div>
            <div class="stat"><span id="b-percent">50</span>%</div>
          </div>
        </div>
      </div>
    </div>
    <div id="result">
      <span id="total"></span>
    </div>
    <script src="app.js"></script>
  </body>
</html>
