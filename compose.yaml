# Full stack. App images are built with `make build` (ko), then `make dev` or `make up`.
# Services belong to the `microservices` or `monolith` profile; db is shared. The Makefile picks the profiles.
services:
  valkey:
    profiles: [microservices]
    image: valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  vote:
    profiles: [microservices]
    image: ${REGISTRY:-rgy.k8s.devops-svc-ag.com/polytech}/vote:${TAG:-dev}
    pull_policy: never
    environment:
      VALKEY_URL: valkey://valkey:6379/0
      OPTION_A: Glaces
      OPTION_B: Sorbets
    ports:
      - "5000:8080"
    depends_on:
      valkey:
        condition: service_healthy

  worker:
    profiles: [microservices]
    image: ${REGISTRY:-rgy.k8s.devops-svc-ag.com/polytech}/worker:${TAG:-dev}
    pull_policy: never
    environment:
      VALKEY_URL: valkey://valkey:6379/0
      POSTGRES_URL: postgres://postgres:postgres@db:5432/postgres
    depends_on:
      valkey:
        condition: service_healthy
      db:
        condition: service_healthy

  result:
    profiles: [microservices]
    image: ${REGISTRY:-rgy.k8s.devops-svc-ag.com/polytech}/result:${TAG:-dev}
    pull_policy: never
    environment:
      POSTGRES_URL: postgres://postgres:postgres@db:5432/postgres
    ports:
      - "5001:4000"
    depends_on:
      db:
        condition: service_healthy
      worker:
        condition: service_started

  # Single-image variant (vote + result, Postgres only).
  monolith:
    profiles: [monolith]
    image: ${REGISTRY:-rgy.k8s.devops-svc-ag.com/polytech}/monolith:${TAG:-dev}
    pull_policy: never
    environment:
      POSTGRES_URL: postgres://postgres:postgres@db:5432/postgres
      OPTION_A: Glaces
      OPTION_B: Sorbets
    ports:
      - "5002:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
