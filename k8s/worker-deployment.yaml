apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - image: ghcr.io/avistotelecom/polytech-training/worker:latest
          name: worker
          ports:
            - containerPort: 8080
              name: healthz
          # The worker can take a while to start: liveness and readiness only run once
          # the startup probe succeeds, and it allows up to 12 x 5 s = 60 s.
          startupProbe:
            httpGet:
              path: /healthz
              port: healthz
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz
              port: healthz
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
          env:
            - name: VALKEY_URL
              value: valkey://valkey:6379/0
            - name: POSTGRES_URL
              value: postgres://postgres:postgres@db:5432/postgres
