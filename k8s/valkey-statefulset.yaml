apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: valkey
  name: valkey
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - image: valkey/valkey:8-alpine
          name: valkey
          ports:
            - containerPort: 6379
              name: valkey
          volumeMounts:
            - mountPath: /data
              name: valkey-data
  volumeClaimTemplates:
    - metadata:
        name: valkey-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Mi
