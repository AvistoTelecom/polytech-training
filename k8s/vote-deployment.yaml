apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
        - image: ghcr.io/avistotelecom/polytech-training/vote:latest
          name: vote
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          env:
            - name: VALKEY_URL
              value: valkey://valkey:6379/0
            - name: OPTION_A
              value: Cats
            - name: OPTION_B
              value: Dogs
