apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: result
  name: result
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
        - image: ghcr.io/avistotelecom/polytech-training/result:latest
          name: result
          ports:
            - containerPort: 4000
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          env:
            - name: POSTGRES_URL
              value: postgres://postgres:postgres@db:5432/postgres
            - name: OPTION_A
              value: Cats
            - name: OPTION_B
              value: Dogs
