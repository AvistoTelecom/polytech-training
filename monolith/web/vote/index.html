<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{{.OptionA}} vs {{.OptionB}}!</title>
    <meta name = "viewport" content = "width=device-width, initial-scale = 1.0">
    <meta name="keywords" content="docker-compose, docker, stack">
    <meta name="author" content="Tutum dev team">
    <link rel='stylesheet' href="style.css" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.4.0/css/font-awesome.min.css">
    {{if .Logs}}<link rel='stylesheet' href='../logs/logs.css' />{{end}}
  </head>
  <body>
    <div id="content-container">
      <div id="content-container-center">
        <h3>{{.OptionA}} vs {{.OptionB}}!</h3>
        <form id="choice" name='form' method="POST" action="/vote/">
          <button id="a" type="submit" name="vote" class="a" value="a">{{.OptionA}}</button>
          <button id="b" type="submit" name="vote" class="b" value="b">{{.OptionB}}</button>
        </form>
        <div id="tip">
          (Tip: you can change your vote)
        </div>
        <div id="hostname">
          Processed by container ID {{.Hostname}}
        </div>
      </div>
    </div>
    {{if .Logs}}<script src="../logs/logs.js" data-src="../logs/stream"></script>{{end}}
    <script src="https://code.jquery.com/jquery-latest.min.js" type="text/javascript"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.js"></script>

    {{if .Vote}}
    <script>
      var vote = {{.Vote}};

      if(vote == "a"){
        $(".a").prop('disabled', true);
        $(".a").html({{.OptionA}} + ' <i class="fa fa-check-circle"></i>');
        $(".b").css('opacity','0.5');
      }
      if(vote == "b"){
        $(".b").prop('disabled', true);
        $(".b").html({{.OptionB}} + ' <i class="fa fa-check-circle"></i>');
        $(".a").css('opacity','0.5');
      }
    </script>
    {{end}}
  </body>
</html>
